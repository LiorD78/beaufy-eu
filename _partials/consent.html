<!-- ── COOKIE CONSENT + MĚŘENÍ (sdílený partial, vkládá build-includes.py) ──
     v3: dvě kategorie souhlasu.
     Analytické: GA4 G-KCZB40W1F3, Microsoft Clarity wt15zbt8i0.
     Marketingové: Google Ads AW-17771919700, Meta Pixel 1174578051554403, Seznam Sklik retargeting 1664861.
     Nic se nenačte bez souhlasu. Consent Mode v2: výchozí stav denied, po souhlasu update granted.
     Volba se ukládá do localStorage pod klíčem beaufyConsent (v3).
     Konverze: generate_lead (poptávkový formulář), click_pharmacy (proklik do e-shopu lékárny). -->
<style>
  .bf-consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:640px;margin:0 auto;background:#0F172A;color:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 18px 50px rgba(15,23,42,.35);font:400 .9rem/1.55 'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;display:none}
  .bf-consent.is-visible{display:block}
  .bf-consent p{margin:0 0 14px;color:rgba(255,255,255,.85)}
  .bf-consent a{color:#6ee7f7;text-decoration:underline}
  .bf-consent-actions{display:flex;gap:10px;flex-wrap:wrap}
  .bf-consent button{font:600 .9rem 'DM Sans',sans-serif;border-radius:999px;padding:10px 20px;cursor:pointer;border:1px solid transparent}
  .bf-consent .bf-accept{background:#F59E0B;color:#0F172A}
  .bf-consent .bf-reject,.bf-consent .bf-analytics{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
  .bf-consent button:focus-visible{outline:2px solid #6ee7f7;outline-offset:2px}
</style>
<div class="bf-consent" id="bfConsent" role="dialog" aria-live="polite" aria-label="Souhlas s cookies">
  <p>Se souhlasem používáme analytické cookies (Google Analytics, Microsoft Clarity), abychom věděli, jak web používáte, a marketingové cookies (Google Ads, Meta, Seznam Sklik), abychom vám mohli ukazovat relevantní reklamu. Bez souhlasu se nic neměří. Více v <a href="/zasady-ochrany-osobnich-udaju.html#cookies">zásadách ochrany osobních údajů</a>.</p>
  <div class="bf-consent-actions">
    <button type="button" class="bf-accept" id="bfConsentAccept">Přijmout vše</button>
    <button type="button" class="bf-analytics" id="bfConsentAnalytics">Jen analytické</button>
    <button type="button" class="bf-reject" id="bfConsentReject">Odmítnout</button>
  </div>
</div>
<script>
(function () {
  var GA_ID = 'G-KCZB40W1F3', CLARITY_ID = 'wt15zbt8i0', ADS_ID = 'AW-17771919700',
      FB_PIXEL = '1174578051554403', SKLIK_RTG = 1664861, KEY = 'beaufyConsent';
  window.dataLayer = window.dataLayer || [];
  function gtag(){
    dataLayer.push(arguments);
    /* poptávkový formulář volá gtag('event','generate_lead') → při marketingovém souhlasu i Meta Lead */
    if (arguments[0] === 'event' && arguments[1] === 'generate_lead' && typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }
  }
  window.gtag = gtag;
  gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });

  var gtagLoaded = false;
  function loadGtag(id) {
    if (gtagLoaded) return; gtagLoaded = true;
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
    document.head.appendChild(s);
    gtag('js', new Date());
  }

  var aLoaded = false;
  function loadAnalytics() {
    if (aLoaded) return; aLoaded = true;
    gtag('consent', 'update', { analytics_storage: 'granted' });
    loadGtag(GA_ID);
    gtag('config', GA_ID, { anonymize_ip: true });
    (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,'clarity','script',CLARITY_ID);
    window.clarity('consent');
  }

  var mLoaded = false;
  function loadMarketing() {
    if (mLoaded) return; mLoaded = true;
    gtag('consent', 'update', { ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted' });
    loadGtag(ADS_ID);
    gtag('config', ADS_ID);
    /* Meta Pixel */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', FB_PIXEL);
    window.fbq('track', 'PageView');
    /* Seznam Sklik retargeting */
    var r = document.createElement('script');
    r.async = true; r.src = 'https://c.seznam.cz/js/rc.js';
    r.onload = function () {
      try {
        if (window.sznIVA && window.sznIVA.IS) window.sznIVA.IS.updateIdentities({ eid: null });
        if (window.rc && window.rc.retargetingHit) window.rc.retargetingHit({ rtgId: SKLIK_RTG, consent: 1 });
      } catch (e) {}
    };
    document.head.appendChild(r);
  }

  function read() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save(a, m) { try { localStorage.setItem(KEY, JSON.stringify({ analytics: a, marketing: m, ts: new Date().toISOString(), v: 3 })); localStorage.removeItem('cookieChoice'); } catch (e) {} }
  function apply(c) { if (c.analytics) loadAnalytics(); if (c.marketing) loadMarketing(); }

  var box = document.getElementById('bfConsent');
  function show() { box.classList.add('is-visible'); }
  function hide() { box.classList.remove('is-visible'); }

  function choose(a, m) {
    var had = read(); save(a, m); hide();
    if (had && ((had.analytics && !a) || (had.marketing && !m))) { location.reload(); return; }
    apply({ analytics: a, marketing: m });
  }
  document.getElementById('bfConsentAccept').addEventListener('click', function () { choose(true, true); });
  document.getElementById('bfConsentAnalytics').addEventListener('click', function () { choose(true, false); });
  document.getElementById('bfConsentReject').addEventListener('click', function () { choose(false, false); });
  /* Proklik do lékárny = hlavní konverze distributora (GA4 klíčová událost click_pharmacy → import do Google Ads; Meta vlastní událost) */
  var PHARM = /(^|\.)(drmax\.cz|benu\.cz|lekarna\.cz|lekarnaave\.cz|lekarnalemon\.cz|magistra\.cz|mojelekarna\.cz|alza\.cz|pilulka\.cz|rohlik\.cz|dr-max\.sk|benulekaren\.sk)$/i;
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="http"]');
    if (!a) return;
    var h; try { h = new URL(a.href).hostname.replace(/^www\./, ''); } catch (err) { return; }
    if (!PHARM.test(h)) return;
    var prod = (location.pathname.split('/')[1] || 'homepage');
    gtag('event', 'click_pharmacy', { pharmacy: h, product: prod, link_url: a.href, transport_type: 'beacon' });
    if (typeof window.fbq === 'function') window.fbq('trackCustom', 'ClickPharmacy', { pharmacy: h, product: prod });
    if (typeof window.clarity === 'function') window.clarity('event', 'click_pharmacy');
  }, true);
  window.beaufyCookieSettings = function () { show(); };
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-cookie-settings]');
    if (t) { e.preventDefault(); show(); }
  });

  var c = read();
  if (c && c.v === 3) { apply(c); }
  else if (c && c.analytics === true) { /* souhlas z verze 2: analytika běží dál, na marketing se zeptáme */ loadAnalytics(); setTimeout(show, 600); }
  else { setTimeout(show, 600); }
})();
</script>
